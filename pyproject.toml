[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken-orchestrator"
version = "0.1.0"
description = "Terminal-first coding orchestration with explicit planning approval"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "textual==8.2.8"]

[project.scripts]
kraken = "kraken.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kraken = ["skills/*/SKILL.md"]
